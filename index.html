<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5eee4">
<meta name="description" content="You're invited to A Children's Story Cooking Party with First Church Young Adults, Sunday, November 15.">
<meta property="og:type" content="website"><meta property="og:title" content="A Children's Story Cooking Party"><meta property="og:description" content="First Church Young Adults · Sunday, November 15 · You're invited!"><meta property="og:image" content="front.png">
<title>A Children's Story Cooking Party · First Church Young Adults</title>
<style>
:root{--paper:#f5eee4;--ink:#322a25;--red:#8b3029}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:radial-gradient(ellipse at 50% 32%,#fffaf3,#e6d8c5 95%);color:var(--ink);font-family:Georgia,serif}main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;padding:20px 12px;overflow:hidden}.scene{position:relative;width:min(528px,calc((100svh - 112px)*.6875),calc(100vw - 28px));aspect-ratio:704/1024;perspective:1800px}.book{position:absolute;inset:0;perspective:1800px;filter:drop-shadow(0 12px 16px #51423330);transition:opacity .55s,transform 1.1s cubic-bezier(.2,.75,.2,1);opacity:0;transform:translateY(18%) scale(.76);pointer-events:none}.scene.revealed .book{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}.inside,.cover{position:absolute;inset:0}.inside{z-index:0}.cover{z-index:1}.rsvp-link{position:absolute;left:29%;top:87.3%;width:56%;height:6.5%;display:block;border-radius:4px;cursor:pointer;pointer-events:none;visibility:hidden}.book.open .rsvp-link{pointer-events:auto;visibility:visible}.rsvp-link:focus-visible{outline:3px solid #8b3029;outline-offset:2px}.inside{background:var(--paper)}.inside img,.cover img{display:block;width:100%;height:100%}.cover{transform-origin:0 50%;transform-style:preserve-3d;transition:transform 1.3s cubic-bezier(.22,.7,.18,1),filter 1.3s;backface-visibility:hidden}.cover:after{content:"";position:absolute;inset:0;box-shadow:inset 8px 0 14px #34271912;pointer-events:none}.book.open .cover{transform:rotateY(-165deg);filter:brightness(.88);pointer-events:none}.open-hotspot{position:absolute;left:38%;top:76%;width:53%;height:13%;background:transparent;border:0;border-radius:5px;cursor:pointer}.open-hotspot:focus-visible,.seal:focus-visible{outline:3px solid #4e2b27;outline-offset:5px}
/* Envelope: back panel, folded side pockets, triangular top flap and wax seal. */
.envelope-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .6s,visibility .6s;z-index:5}.scene.revealed .envelope-stage{opacity:0;visibility:hidden;pointer-events:none}.envelope{position:relative;width:94%;aspect-ratio:1.42;filter:drop-shadow(0 14px 17px #5d443c40);transform:translateY(5%)}.env-back{position:absolute;inset:0;background:#e2cfb0;border:1px solid #baa383;box-shadow:inset 0 0 32px #9b79522a}.env-pocket{position:absolute;inset:0;clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);background:linear-gradient(140deg,#f1e2ca,#d9bd97 95%);z-index:3}.env-pocket:after{content:"";position:absolute;inset:0;clip-path:polygon(0 100%,50% 43%,100% 100%);background:#e9d4b5}.env-flap{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 59%);background:linear-gradient(#eee0c8,#d6b993);z-index:4;transform-origin:50% 0;transition:transform .9s cubic-bezier(.25,.7,.2,1),opacity .4s .5s;filter:drop-shadow(0 2px 2px #8667464d)}.envelope-stage.unsealed .env-flap{transform:rotateX(170deg);opacity:0}.seal{position:absolute;z-index:6;left:50%;top:54%;transform:translate(-50%,-50%);width:112px;height:112px;border-radius:50%;border:0;background:transparent url("wax-seal.png") center/contain no-repeat;filter:drop-shadow(0 4px 5px #4b241b66);color:#f2c6a6;font:small-caps 26px Georgia,serif;letter-spacing:.06em;cursor:pointer;transition:opacity .3s,transform .45s}.seal:hover{transform:translate(-50%,-50%) scale(1.06)}.envelope-stage.unsealed .seal{opacity:0;transform:translate(-50%,-50%) scale(.6);pointer-events:none}.env-label{position:absolute;z-index:5;left:0;right:0;bottom:13%;text-align:center;font-variant:small-caps;letter-spacing:.18em;font-size:clamp(12px,2.8vw,16px);color:#795443;pointer-events:none}.envelope-stage.unsealed .env-label{opacity:0}.env-letter{position:absolute;z-index:2;left:50%;top:52%;width:55%;aspect-ratio:704/1024;height:auto;background:#f5eee4 url('front.png') center/100% 100% no-repeat;box-shadow:0 3px 12px #5e463c66;transform:translate(-50%,-50%) rotate(90deg) scale(.72);transition:transform 1.05s cubic-bezier(.2,.7,.2,1),top 1.05s cubic-bezier(.2,.7,.2,1)}.envelope-stage.extracting .env-letter{z-index:7;top:-28%;transform:translate(-50%,-50%) rotate(90deg) scale(.82)}.envelope-stage.turning .env-letter{z-index:7;top:-37%;transform:translate(-50%,-50%) rotate(0deg) scale(1)}.actions{min-height:37px;display:flex;gap:10px;align-items:center;justify-content:center}.actions button{background:#f7f0e6;border:1px solid #927e6a;border-radius:4px;padding:8px 15px;font:small-caps 15px Georgia,serif;letter-spacing:.06em;color:var(--ink);cursor:pointer}.actions button:hover{background:white}.hint{font-size:13px;font-style:italic;color:#68594f;text-align:center;min-height:18px}[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){.env-flap,.seal,.env-letter,.book,.envelope-stage,.cover{transition-duration:.01ms!important;transition-delay:0ms!important}}
</style>
</head>
<body><main>
<div class="scene" id="scene">
 <div class="envelope-stage" id="envelopeStage" aria-label="Sealed invitation envelope">
  <div class="envelope"><div class="env-back"></div><div class="env-letter"></div><div class="env-pocket"></div><div class="env-flap"></div><button class="seal" id="seal" type="button" aria-label="Break the Alice in Wonderland wax seal and open the envelope"></button></div>
 </div>
 <div class="book" id="book" aria-label="Interactive invitation card" aria-hidden="true">
  <div class="inside"><img src="inside.png" alt="Inside invitation: Sunday, November 15, six o'clock until half past nine, at Casey's House. Bring a dish inspired by a classic children's story. The invitation includes RSVP wording in the artwork."><a class="rsvp-link" href="https://forms.gle/ik5AgJQSJPUqzVuH7" target="_blank" rel="noopener noreferrer" aria-label="RSVP using the Google Form (opens in a new tab)" tabindex="-1"></a></div>
  <div class="cover"><img src="front.png" alt="First Church Young Adults: A Children's Story Cooking Party, illustrated with an Alice in Wonderland tea party."><button class="open-hotspot" id="open" type="button" aria-label="Open the invitation" disabled></button></div>
 </div>
</div>
<div class="actions"><button id="close" type="button" hidden>↶ Close invitation</button><button id="reset" type="button" hidden>↶ Return to envelope</button></div>
<div class="hint" id="hint" aria-live="polite">Click the wax seal to open your invitation.</div>
</main>
<script>
const scene=document.getElementById('scene'),stage=document.getElementById('envelopeStage'),book=document.getElementById('book'),seal=document.getElementById('seal'),openButton=document.getElementById('open'),closeButton=document.getElementById('close'),resetButton=document.getElementById('reset'),hint=document.getElementById('hint');let timer;
seal.addEventListener('click',()=>{seal.disabled=true;stage.classList.add('unsealed');hint.textContent='Opening your invitation…';timer=setTimeout(()=>{stage.classList.add('extracting');hint.textContent='Your invitation is sliding out…';timer=setTimeout(()=>{stage.classList.add('turning');hint.textContent='Turning your invitation…';timer=setTimeout(()=>{scene.classList.add('revealed');book.setAttribute('aria-hidden','false');stage.setAttribute('aria-hidden','true');openButton.disabled=false;resetButton.hidden=false;hint.textContent='Click “Open Me” on the card to turn the cover.';openButton.focus({preventScroll:true})},1100)},1100)},850)});
openButton.addEventListener('click',()=>{book.classList.add('open');openButton.disabled=true;closeButton.hidden=false;document.querySelector('.rsvp-link').removeAttribute('tabindex');hint.textContent='We hope to see you there!';closeButton.focus({preventScroll:true})});
closeButton.addEventListener('click',()=>{book.classList.remove('open');openButton.disabled=false;closeButton.hidden=true;document.querySelector('.rsvp-link').setAttribute('tabindex','-1');hint.textContent='Click “Open Me” on the card to turn the cover.';openButton.focus({preventScroll:true})});
resetButton.addEventListener('click',()=>{clearTimeout(timer);book.classList.remove('open');scene.classList.remove('revealed');stage.classList.remove('unsealed','extracting','turning');stage.removeAttribute('aria-hidden');book.setAttribute('aria-hidden','true');seal.disabled=false;openButton.disabled=true;closeButton.hidden=true;resetButton.hidden=true;document.querySelector('.rsvp-link').setAttribute('tabindex','-1');hint.textContent='Click the wax seal to open your invitation.';seal.focus({preventScroll:true})});
</script></body></html>
